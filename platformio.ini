; PlatformIO Project Configuration File
; Target: Waveshare / Spotpear ESP32-C6-LCD-1.47 (ESP32-C6FH4, 4 MB Flash, ST7789 172x320, WS2812 GPIO8)

[platformio]
; Short cache/packages path to avoid Windows 260-char MAX_PATH limit during Arduino-ESP32 v3 extraction
packages_dir = C:/Users/honcharenkoa/.p/pkg
cache_dir = C:/Users/honcharenkoa/.p/c

[env:esp32-c6-lcd-147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; 4 MB embedded flash on ESP32-C6FH4
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Enable native USB Serial/JTAG for Serial output
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
upload_speed = 921600
